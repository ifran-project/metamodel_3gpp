sonar.projectKey=ifran-project_metamodel_3gpp
sonar.organization=ifran-project


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=metamodel_3gpp
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Ignore false positive issues
sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# Ignore Text in pyproject.toml
sonar.issue.ignore.multicriteria.e1.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.e1.resourceKey=pyproject.toml

# Ignore GitHub Actions S8541 and S8544 in .github/workflows/ci.yaml
sonar.issue.ignore.multicriteria.e2.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e2.resourceKey=.github/workflows/ci.yaml
sonar.issue.ignore.multicriteria.e3.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e3.resourceKey=.github/workflows/ci.yaml

# Ignore IPython S1313
sonar.issue.ignore.multicriteria.e4.ruleKey=ipython:S1313
sonar.issue.ignore.multicriteria.e4.resourceKey=**
